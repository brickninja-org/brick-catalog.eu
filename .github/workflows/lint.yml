name: Lint
on:
  workflow_call:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js env
        uses: ./.github/actions/setup-node-env
        with:
          cache-key: lint
      - name: Run lint
        run: pnpm run lint
